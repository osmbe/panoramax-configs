# Placeholder secrets used only for `nix flake check` on a fresh clone.
#
# THIS FILE IS NOT ENCRYPTED — every value is an obvious placeholder. The flake
# falls back to this file when ./secrets/panoramax-osmbe.yaml does not exist
# (i.e. when the secrets submodule has not been initialised — typical for CI
# and contributors without access to the private panoramax-secrets repo).
#
# Sops file validation is disabled while this fallback is in use; the real
# encrypted file is always validated.
#
# Real deploys must use `?submodules=1` on the flake URL so Nix includes the
# secrets submodule. Without it, the build falls back to this file and the
# stack would start with placeholder OAuth/DB credentials.
panoramax:
  env: |
    OAUTH_CLIENT_ID=SET-ME-osm-oauth-client-id
    OAUTH_CLIENT_SECRET=SET-ME-osm-oauth-client-secret
    FLASK_SECRET_KEY=SET-ME-flask-secret-key
    PG_PASSWORD=SET-ME-pg-password

netbird:
  setup-key: SET-ME-netbird-setup-key

git:
  deploy-key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    SET-ME-deploy-key
    -----END OPENSSH PRIVATE KEY-----

borg:
  passphrase: SET-ME-borg-passphrase
  ssh-key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    SET-ME-borg-ssh-key
    -----END OPENSSH PRIVATE KEY-----
  repo-url: SET-ME-borg-repo-url
  host-key: SET-ME-borg-host-key

healthchecks:
  heartbeat-url: https://hc-ping.example.invalid/SET-ME-heartbeat
  nfs-health-url: https://hc-ping.example.invalid/SET-ME-nfs
  pgbackrest-ping-url: https://hc-ping.example.invalid/SET-ME-pgbackrest
  borgbackup-ping-url: https://hc-ping.example.invalid/SET-ME-borg
  pgdump-s3-ping-url: https://hc-ping.example.invalid/SET-ME-pgdump
  flake-update-url: https://hc-ping.example.invalid/SET-ME-flakeupdate
  nixos-upgrade-url: https://hc-ping.example.invalid/SET-ME-nixosupgrade

s3:
  env: |
    AWS_ACCESS_KEY_ID=SET-ME-aws-key-id
    AWS_SECRET_ACCESS_KEY=SET-ME-aws-secret
    AWS_ENDPOINT_URL=https://example.invalid
    S3_BUCKET=set-me-s3-bucket

loki:
  push-url: https://SET-ME-loki-push.example.invalid/loki/api/v1/push
  push-user: SET-ME-loki-user
  push-token: SET-ME-loki-token

prometheus:
  remote-write-url: https://SET-ME-prometheus-remote-write.example.invalid/api/prom/push
  remote-write-user: SET-ME-prometheus-user
  remote-write-token: SET-ME-prometheus-token
