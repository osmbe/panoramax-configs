# PostgreSQL performance tuning for Panoramax
# Tuned for our Infomaniak VPS
# Generated with https://pgtune.leopard.in.ua/ — adjust if VPS is resized.
# https://pgtune.leopard.in.ua/?dbVersion=16&osType=linux&dbType=web&cpuNum=4&totalMemory=12&totalMemoryUnit=GB&connectionNum=500&hdType=ssd&dbSize=less_ram

listen_addresses = '*'
port = 5432

max_connections = 500
shared_buffers = 3GB
effective_cache_size = 9GB
maintenance_work_mem = 768MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 8113kB
huge_pages = try
jit = off
wal_compression = lz4
min_wal_size = 1GB
max_wal_size = 4GB
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# WAL Archiving (pgBackRest)
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=panoramax archive-push %p'
archive_timeout = 300
