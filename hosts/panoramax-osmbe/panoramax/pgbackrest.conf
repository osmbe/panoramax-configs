[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full-type=time
repo1-retention-full=60
repo1-block=y
repo1-bundle=y
compress-type=zst
process-max=2
start-fast=y
delta=y
log-level-console=info
log-level-file=detail

[panoramax]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=gvs
pg1-database=geovisio
