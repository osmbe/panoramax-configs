# Compose-internal nginx. Adapted from upstream Panoramax full-osm-auth
# template: see docker/full-osm-auth/nginx.conf in the panoramax/api repo.
# CORS, UUID-rewrite, and security-header rationale lives upstream — keep
# this file as close to upstream as possible to ease future updates.
worker_processes auto;

events { worker_connections 1024; }

http {
    sendfile on;

    # Real client IP recovery.
    #
    # Host Caddy terminates TLS and reaches this container via the published
    # 127.0.0.1:8080; Docker NATs the source address to the bridge gateway, so
    # without this every request logs $remote_addr as 172.18.0.1 and the
    # X-Real-IP we forward upstream is that gateway too. Caddy already sets
    # X-Forwarded-For to the real client, so trust the Docker private range and
    # rewrite $remote_addr from it. nginx is bound to 127.0.0.1 only, so this
    # range is unreachable from the internet and safe to trust.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Log the recovered client IP plus the raw XFF header (handy when
    # verifying the real_ip setup). Path keeps the image's stdout symlink.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" xff="$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    upstream api      { server api:5000; }
    upstream website  { server website:3000; }

    # Amazon crawler bots (Amazonbot, Amzn-SearchBot, Amzn-User)
    map $http_user_agent $is_amazon_bot {
        default                   0;
        ~Amazonbot                1;
        ~Amzn-SearchBot           1;
        ~Amzn-User               1;
    }

    server {
        listen 8080;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size    100M;
        client_body_buffer_size 6M;
        client_body_timeout     120s;
        send_timeout            60s;
        proxy_read_timeout      120s;
        proxy_send_timeout      120s;

        location /api {
            proxy_pass     http://api;
            proxy_redirect default;
        }

        location / {
            proxy_pass     http://website;
            proxy_redirect default;
        }

        location = /robots.txt {
            alias /etc/nginx/robots.txt;
            default_type text/plain;
        }

        # Static assets (logo + favicon).
        location = /logo.png {
            alias /etc/nginx/logo.png;
        }
        location = /favicon.ico {
            alias /etc/nginx/favicon.ico;
        }

        # UUID-to-path rewrite: maps flat UUIDs to a 5-deep nested directory
        # layout (matches Panoramax's on-disk image storage scheme).
        rewrite ^/(permanent|derivates|derivatives)/([0-9a-f][0-9a-f])([0-9a-f][0-9a-f])([0-9a-f][0-9a-f])([0-9a-f][0-9a-f])-(.*)$ /$1/$2/$3/$4/$5/$6 last;

        gzip on;
        gzip_types text/plain application/xml image/svg+xml text/css text/javascript text/xml application/json application/javascript;

        location /permanent/ {
            if ($is_amazon_bot) { return 403; }
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            root /data/geovisio;
        }

        location /derivates/ {
            if ($is_amazon_bot) { return 403; }
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            root /data/geovisio;
        }

        # Public alias: English `/derivatives/` → on-disk French `derivates/`.
        # The dataset, FS_DERIVATES_URL, and on-disk layout all use the French
        # spelling because that's what Panoramax expects internally; only the
        # public URL uses English.
        location /derivatives/ {
            if ($is_amazon_bot) { return 403; }
            alias /data/geovisio/derivates/;
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        }
    }
}
